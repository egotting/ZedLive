x-services-template:
  api-template: &api-template
    image: api-template
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - backend
      - linkcomposes
        

services:
  load-balancer:
    image: nginx:latest
    restart: always
    volumes:
      - .././././server/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    networks:
      - backend
  
  api01:
    <<: *api-template
  api02:
    <<: *api-template

networks:
  backend:
    driver: bridge
  linkcomposes:
    name: linkcomposes
    external: true