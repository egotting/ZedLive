x-configuration: &configuration
  command: [ "postgres", "-c", "config_file=/etc/postgresqltest.conf", "-c", "log_statement=none", "-c", "log_min_duration_statement=1000", "-c", "log_connections=on", "-c", "log_disconnections=on" ]

x-common-env: &common-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres123
  POSTGRES_DB: ZedLiveDatabaseTest

x-healthcheck: &pg-healthcheck
  test: [ "CMD-SHELL", "pg_isready -U postgres" ]
  interval: 10s
  retries: 5
  start_period: 10s

services:
  dbtest:
    image: postgres:16
    <<: *configuration
    volumes:
      - ../postgres/postgresqltest.conf:/etc/postgresqltest.conf
    container_name: dbtest
    ports:
      - "5432:5432"
    environment:
      <<: *common-env
    healthcheck: *pg-healthcheck